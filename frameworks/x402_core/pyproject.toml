[project]
name = "x402-core"
version = "0.1.0"
description = "Framework-agnostic x402 payment layer: wallet, tool operations, telemetry"
requires-python = ">=3.11"
# Deliberately no framework and no LLM SDK. An agent adds its own.
dependencies = [
    # The governance layer, from PyPI. An example that only works from a
    # particular checkout layout is not an example.
    "tesoro>=0.1.0","x402[evm,httpx]>=2.18.0"]

[tool.setuptools.packages.find]
include = ["x402_core*"]
